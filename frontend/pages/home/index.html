<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Autoevaluaciones</title>
  <link rel="stylesheet" href="../../assets/css/home.css" />
  <link rel="icon" type="image/png" href="../../assets/images/favicon-128x128.png" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div class="home-top-bar">
    <button id="btnLogout" class="btn-secondary">⟵ Cerrar sesión</button>
    <button id="btnAdmin" class="btn-primary-outline profile-btn" title="Panel administrativo">
      <i class="fa-solid fa-user-circle"></i>
    </button>
  </div>

  <div class="container">
    <div class="welcome-section">
      <h1 id="welcomeTitle">Bienvenido/a</h1>
      <p class="subtitle">Selecciona una opción para continuar</p>
    </div>

    <div class="nav-buttons">
      <button id="cardAsistencia" class="nav-button" onclick="location.href='/pages/asistencia/index.html'">
        <div class="button-icon">📋</div>
        <div class="button-content">
          <div class="button-title">Asistencia</div>
          <div class="button-description">Registra tu asistencia diaria</div>
        </div>
        <div class="button-arrow">→</div>
      </button>

      <button id="cardAutoevaluacion" class="nav-button" onclick="location.href='/pages/autoevaluacion/index.html'">
        <div class="button-icon">✓</div>
        <div class="button-content">
          <div class="button-title">Autoevaluación</div>
          <div class="button-description">Completa tu evaluación personal</div>
        </div>
        <div class="button-arrow">→</div>
      </button>

      <button id="cardRankings" class="nav-button" onclick="location.href='/pages/ranking/ranking.html'">
        <div class="button-icon">🏆</div>
        <div class="button-content">
          <div class="button-title">Rankings</div>
          <div class="button-description">Consulta las clasificaciones</div>
        </div>
        <div class="button-arrow">→</div>
      </button>

      <button class="nav-button" onclick="window.open('https://www.notion.so/login?from=marketing&pathname=%2F', '_blank')">
        <div class="button-icon">
          <img src="../../assets/images/Notion-icon.png" alt="Notion" style="width: 32px; height: 32px; border-radius: 6px;">
        </div>
        <div class="button-content">
          <div class="button-title">Notion</div>
          <div class="button-description">Apunta tus pendientes aquí</div>
        </div>
        <div class="button-arrow">→</div>
      </button>

      <button
  id="cardConstancia"
  class="nav-button"
  style="display: none;"
  onclick="solicitarConstancia()"
>
  <div class="button-icon">📜</div>
  <div class="button-content">
    <div class="button-title">Constancia 520h</div>
    <div class="button-description">Solicita tu certificado</div>
  </div>
  <div class="button-arrow">→</div>
</button>

      <button
        id="cardResultados"
        class="nav-button"
        data-section="resultados"
        onclick="location.href='/pages/resultados/resultados.html'"
      >
        <div class="button-icon">🎡</div>
        <div class="button-content">
          <div class="button-title">Ruleta de Incentivos</div>
          <div class="button-description">Reclama tu premio</div>
        </div>
        <div class="button-arrow">→</div>
      </button>
    </div>

    <div class="footer">
      <p class="footer-text">© 2025 Sanilab - Todos los derechos reservados</p>
    </div>
  </div>

  <div id="no-access-modal" class="no-access-modal hidden">
    <div class="no-access-modal__backdrop"></div>
    <div class="no-access-modal__content">
      <div class="no-access-modal__icon">!</div>
      <h2>Acceso denegado</h2>
      <p>No tienes permisos para acceder al panel administrativo.</p>
      <button id="closeNoAccess" class="no-access-modal__btn">Entendido</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../../js/pages/home.js"></script>
</body>
</html>
