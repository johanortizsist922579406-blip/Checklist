<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro - Autoevaluaciones</title>
  <link rel="stylesheet" href="../../assets/css/auth.css" />
</head>
<body>
  <div class="register-bg"></div>
  <section class="register-container">
    <img src="../../assets/images/Sanilab-logo.png" alt="Sanilab Logo" class="register-logo">
    <h1>Registro</h1>
    <form id="registroForm" autocomplete="off">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" required />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required />

      <label for="area">Área</label>
      <select id="area" name="area" required>
      </select>
      <label>Género</label>
      <div class="genero-group">
      <label class="genero-option">
      <input type="radio" name="genero" value="M" required />
      Hombre
      </label>
      <label class="genero-option">
      <input type="radio" name="genero" value="F" required />
      Mujer
      </label>
      </div>

    <button type="submit">Registrarse</button>
    </form>
    <div class="register-footer">
      ¿Ya tienes cuenta?
      <a href="../../index.html">Iniciar sesión</a>
    </div>
  </section>
  <script src="../../js/pages/registro.js"></script>
</body>
</html>
